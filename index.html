<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BoxHead</title>
<meta name="description" content="BoxHead — 3,333 on Robinhood Chain.">
<meta property="og:title" content="BoxHead">
<meta property="og:description" content="3,333 heads that have seen enough.">
<meta property="og:image" content="https://theboxhead.fun/img/hero.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="img/hero.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
:root{--yellow:#FFC800;--ink:#0A0A0A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--yellow);color:var(--ink);
  font-family:'Archivo',system-ui,sans-serif;
  min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;text-align:center;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ---------- falling ink drops ---------- */
.ink-field{position:fixed;inset:0;pointer-events:none;z-index:0}
.drop{
  position:absolute;top:-60px;
  width:14px;height:18px;
  background:var(--ink);
  border-radius:50% 50% 50% 50% / 65% 65% 35% 35%;
  clip-path:path("M7 0C7 0 0 9 0 13a7 7 0 0 0 14 0C14 9 7 0 7 0z");
  animation:fall linear infinite;
  opacity:0.22;
}
@keyframes fall{
  0%{transform:translateY(-60px) scaleY(1)}
  85%{transform:translateY(105vh) scaleY(1.25)}
  100%{transform:translateY(105vh) scaleY(1.25)}
}

/* ---------- content ---------- */
.stage{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}

.art{
  width:clamp(140px,34vw,200px);
  border:4px solid var(--ink);
  box-shadow:12px 12px 0 var(--ink);
  overflow:hidden;line-height:0;margin-bottom:44px;
  animation:bob 4.5s ease-in-out infinite;
}
.art img{width:100%;display:block}
@keyframes bob{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-9px)}
}

h1{
  font-family:'Archivo Black',sans-serif;font-weight:400;
  font-size:clamp(44px,11vw,88px);
  letter-spacing:-0.035em;text-transform:uppercase;line-height:1;
  position:relative;
}
.dots{display:inline-block;width:1.15em;text-align:left}
.dots span{opacity:0;animation:blink 1.5s infinite}
.dots span:nth-child(2){animation-delay:.22s}
.dots span:nth-child(3){animation-delay:.44s}
@keyframes blink{0%,62%,100%{opacity:0}30%{opacity:1}}

/* ---------- ink-fill progress bar ---------- */
.bar{
  position:relative;
  width:min(320px,78vw);height:22px;
  border:4px solid var(--ink);
  margin-top:36px;overflow:hidden;
  background:transparent;
}
.bar-fill{
  position:absolute;inset:0;
  background:var(--ink);
  width:38%;
  animation:sweep 2.1s cubic-bezier(.55,.06,.45,.94) infinite;
}
@keyframes sweep{
  0%{transform:translateX(-105%)}
  100%{transform:translateX(275%)}
}

.sub{
  margin-top:34px;font-size:14px;font-weight:600;
  letter-spacing:0.14em;text-transform:uppercase;opacity:0.62;
}

.link{
  margin-top:38px;
  font-family:'Archivo Black',sans-serif;font-size:13px;
  letter-spacing:0.06em;text-transform:uppercase;
  color:var(--yellow);background:var(--ink);
  border:4px solid var(--ink);padding:14px 24px;
  text-decoration:none;display:inline-block;
  box-shadow:6px 6px 0 rgba(10,10,10,0.28);
  transition:transform .08s ease, box-shadow .08s ease;
}
.link:hover{transform:translate(3px,3px);box-shadow:3px 3px 0 rgba(10,10,10,0.28)}

@media (prefers-reduced-motion:reduce){
  .ink-field{display:none}
  .art{animation:none}
  .dots span{animation:none;opacity:1}
  .bar-fill{animation:none;width:100%}
}
a:focus-visible{outline:4px solid var(--ink);outline-offset:4px}
</style>
</head>
<body>

<div class="ink-field" id="ink" aria-hidden="true"></div>

<div class="stage">
  <div class="art">
    <img src="img/hero.png" alt="A BoxHead character with a box for a head.">
  </div>

  <h1>Loading<span class="dots"><span>.</span><span>.</span><span>.</span></span></h1>

  <div class="bar" role="progressbar" aria-label="Site under construction">
    <div class="bar-fill"></div>
  </div>

  <p class="sub">Not in a hurry. Neither is he.</p>

  <a class="link" href="https://x.com/boxheadfun" target="_blank" rel="noopener">Everything gets posted on X first</a>
</div>

<script>
(function(){
  var field = document.getElementById('ink');
  var COUNT = 22;

  for(var i = 0; i < COUNT; i++){
    var d = document.createElement('div');
    d.className = 'drop';
    d.style.left = (Math.random() * 100) + '%';
    d.style.animationDuration = (3.5 + Math.random() * 4.5) + 's';
    d.style.animationDelay = (Math.random() * 6) + 's';
    var s = 0.5 + Math.random() * 1.1;
    d.style.width = (14 * s) + 'px';
    d.style.height = (18 * s) + 'px';
    d.style.opacity = (0.12 + Math.random() * 0.18).toFixed(2);
    field.appendChild(d);
  }
})();
</script>

</body>
</html>
